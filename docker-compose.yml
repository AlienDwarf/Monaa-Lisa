services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    # Docker-Standard sind 64 MB /dev/shm – zu wenig für parallele Scans und
    # Hash-Joins über Millionen Zeilen ("could not resize shared memory segment")
    shm_size: 1g
    # Tuning für >2 Mio. Paper (Werte bei Bedarf an den RAM des Hosts anpassen)
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_wal_size=2GB
      - -c
      - random_page_cost=1.1
    environment:
      POSTGRES_USER: ${POSTGRES_USER-monaa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD-sicherespasswort}
      POSTGRES_DB: ${POSTGRES_DB-monaa_lisa_db}
    ports:
      - "127.0.0.1:5432:5432" # nur lokal erreichbar, nicht im Netzwerk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-monaa} -d ${POSTGRES_DB:-monaa_lisa_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: app
    image: monaa-lisa-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER-monaa}:${POSTGRES_PASSWORD-sicherespasswort}@db:5432/${POSTGRES_DB-monaa_lisa_db}
      PYTHONPATH: /app/MonaaLisa/src
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      DATA_DIR: /app/data
    volumes:
      - ./MonaaLisa/src:/app/MonaaLisa/src
      - python_cache:/root/.cache/pip
      - app_data:/app/data
    command: ["/bin/sh", "-c", "python MonaaLisa/src/Database/db.py && python MonaaLisa/src/main.py"]

  # Läuft einmal vor dem Backend: Abhängigkeiten + DB-Migrationen.
  # Getrennt vom Backend, weil große Migrationen (Millionen Zeilen) länger
  # dauern können als der Healthcheck des Backends erlaubt.
  migrate:
    image: node:20
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER-monaa}:${POSTGRES_PASSWORD-sicherespasswort}@db:5432/${POSTGRES_DB-monaa_lisa_db}
    volumes:
      - ./MonaaLisa/src/Backend:/app
      - backend_node_modules:/app/node_modules
    command: ["sh", "-c", "npm install && npx prisma generate && npx prisma migrate deploy"]

  backend:
    image: node:20
    working_dir: /app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER-monaa}:${POSTGRES_PASSWORD-sicherespasswort}@db:5432/${POSTGRES_DB-monaa_lisa_db}
      PORT: 3000
    volumes:
      - ./MonaaLisa/src/Backend:/app
      - backend_node_modules:/app/node_modules
    command: ["sh", "-c", "npm run build && npm run start:prod"]
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    healthcheck:
      # /health prüft auch die Datenbankverbindung
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      # Zeit für den Build, bevor der erste Check zählt (Migrationen laufen vorher im migrate-Service)
      start_period: 90s


  frontend:
    build:
      context: ./MonaaLisa/src/Frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - app
      - backend
    volumes:
      - ./MonaaLisa/src/Frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: "http://backend:3000"

  import:
    build:
      context: .
      target: app
    image: monaa-lisa-app:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER-monaa}:${POSTGRES_PASSWORD-sicherespasswort}@db:5432/${POSTGRES_DB-monaa_lisa_db}
    volumes:
      - ./MonaaLisa_dataset_full.jsonl:/app/MonaaLisa_dataset_full.jsonl:ro
      - ./import_dataset.py:/app/import_dataset.py:ro
    working_dir: /app
    profiles:
      - import
    command: ["python", "import_dataset.py", "--file", "MonaaLisa_dataset_full.jsonl", "--batch-size", "5000"]
    
volumes:
  pgdata:
  python_cache:
  backend_node_modules:
  app_data:
