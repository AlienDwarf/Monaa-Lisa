[semanticpaper]
log_level = INFO

# Data directory for downloaded dataset and models
data_dir = /app/data

# Pre-trained model paths (filenames from mirrors.json)
pca_model_path = /app/data/models/pca_model_128d.pkl
umap_model_path = /app/data/models/umap_model_2d.pkl

# Pause between arXiv OAI-PMH pages (arXiv asks for a few seconds)
oai_delay_seconds = 3

# Incremental update interval (days)
incremental_update_interval_days = 30

# SemanticScholar batch request size (max 500). 100 keeps responses small enough
# (long citation lists can make S2 reject large batches); failed batches are split.
s2_batch_size = 100

# Uncaught paper retry interval (days) and max retries.
# After max retries a paper is kept in uncaught_paper ("parked"), not deleted.
uncaught_retry_interval_days = 14
uncaught_max_retries = 4

# Dataset import batch size
import_batch_size = 5000